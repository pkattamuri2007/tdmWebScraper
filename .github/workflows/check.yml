name: Check for new 2026-2027 projects

on:
  schedule:
    # Offset off the exact quarter-hour (:00/:15/:30/:45) — GitHub's scheduled-run
    # queue is most congested there, since that's when most cron jobs on the
    # platform fire, and can delay low-priority scheduled runs by a long margin.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scraper.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_projects.json
          git diff --quiet --cached || git commit -m "Update seen projects [skip ci]"
          git push
