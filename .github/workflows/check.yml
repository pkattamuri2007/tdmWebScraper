name: Check for new 2026-2027 projects

on:
  schedule:
    # GitHub's own scheduler is unreliable (see prd.md §10) and is left here
    # only as a free backup — the real cadence (~every 1 min) comes from an
    # external cron-job.org trigger calling workflow_dispatch directly.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Runs fire faster than a full run reliably completes, so serialize instead
# of letting two runs race on the final git push — a newer trigger bumps a
# still-queued older one rather than piling up an unbounded backlog.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - run: python scraper.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_projects.json seen_sections.json
          git diff --quiet --cached || git commit -m "Update seen projects/sections [skip ci]"
          git push
